<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 平地（可通行）：深色砂石地面。整格满铺、可无缝平铺；纹理刻意压低对比，避免大图铺满后视觉疲劳。 -->
  <defs>
    <linearGradient id="floorBase" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#343d48"/>
      <stop offset="0.55" stop-color="#2f3742"/>
      <stop offset="1" stop-color="#29313b"/>
    </linearGradient>
    <pattern id="floorGrain" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- 浅色砂砾块 -->
      <ellipse cx="18" cy="20" rx="7" ry="5" fill="#4c5666" opacity="0.42"/>
      <polygon points="62,10 76,14 72,24 58,20" fill="#49525f" opacity="0.38"/>
      <ellipse cx="88" cy="44" rx="6" ry="8" fill="#4c5666" opacity="0.32"/>
      <polygon points="10,66 24,62 28,74 14,78" fill="#49525f" opacity="0.38"/>
      <ellipse cx="52" cy="86" rx="8" ry="6" fill="#4c5666" opacity="0.34"/>
      <polygon points="78,72 90,70 92,80 80,84" fill="#49525f" opacity="0.3"/>
      <ellipse cx="40" cy="46" rx="6" ry="6" fill="#4c5666" opacity="0.3"/>
      <!-- 深色石粒 -->
      <ellipse cx="30" cy="32" rx="7" ry="5" fill="#232a35" opacity="0.45"/>
      <polygon points="70,48 84,46 86,56 72,58" fill="#232a35" opacity="0.4"/>
      <ellipse cx="14" cy="90" rx="8" ry="5" fill="#232a35" opacity="0.4"/>
      <polygon points="44,66 56,64 58,72 46,76" fill="#232a35" opacity="0.42"/>
      <ellipse cx="92" cy="16" rx="6" ry="7" fill="#232a35" opacity="0.36"/>
      <ellipse cx="56" cy="30" rx="6" ry="6" fill="#232a35" opacity="0.34"/>
      <!-- 极轻的细颗粒 -->
      <ellipse cx="8" cy="34" rx="4" ry="4" fill="#ffffff" opacity="0.07"/>
      <ellipse cx="64" cy="66" rx="4.5" ry="4.5" fill="#000000" opacity="0.1"/>
      <ellipse cx="36" cy="12" rx="4" ry="4" fill="#ffffff" opacity="0.06"/>
      <ellipse cx="84" cy="92" rx="5" ry="4" fill="#000000" opacity="0.09"/>
      <ellipse cx="50" cy="58" rx="4" ry="4" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#floorBase)"/>
  <rect x="0" y="0" width="100" height="100" fill="url(#floorGrain)"/>
</svg>