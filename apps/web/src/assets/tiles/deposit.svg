<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 提交点（交资源换分）：金色八角平台 + 同心靶心 + 三枚金币，读作"值得抢的目标"。 -->
  <defs>
    <linearGradient id="depositPlate" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6b5618"/>
      <stop offset="0.5" stop-color="#4a3c11"/>
      <stop offset="1" stop-color="#2e2609"/>
    </linearGradient>
    <linearGradient id="depositCoin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e0a92c"/>
    </linearGradient>
  </defs>
  <!-- 平台 -->
  <polygon points="35,11 65,11 89,35 89,65 65,89 35,89 11,65 11,35" fill="url(#depositPlate)" stroke="#f5c542" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="39,17 61,17 83,39 83,61 61,83 39,83 17,61 17,39" fill="none" stroke="#f5c542" stroke-width="4" stroke-linejoin="round" opacity="0.5"/>
  <!-- 靶心 -->
  <circle cx="50" cy="44" r="22" fill="none" stroke="#f5c542" stroke-width="7"/>
  <circle cx="50" cy="44" r="13" fill="#ffe08a" stroke="#8a6a12" stroke-width="4"/>
  <circle cx="50" cy="44" r="5" fill="#8a6a12"/>
  <!-- 金币堆 -->
  <g stroke="#8a6a12" stroke-width="4">
    <ellipse cx="30" cy="78" rx="12" ry="8" fill="#f5c542"/>
    <ellipse cx="50" cy="80" rx="12" ry="8" fill="url(#depositCoin)"/>
    <ellipse cx="70" cy="78" rx="12" ry="8" fill="#ffd964"/>
  </g>
  <g fill="none" stroke="#8a6a12" stroke-width="3" opacity="0.8">
    <ellipse cx="30" cy="78" rx="6" ry="4"/>
    <ellipse cx="50" cy="80" rx="6" ry="4"/>
    <ellipse cx="70" cy="78" rx="6" ry="4"/>
  </g>
</svg>